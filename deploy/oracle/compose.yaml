name: wire

services:
  db:
    image: postgres:16-bookworm
    container_name: wire-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 4g
    cpus: 1.0
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - backend

  app:
    image: ${WIRE_IMAGE:?Set WIRE_IMAGE in .env.production}
    container_name: wire-app
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 0.75
    logging: *default-logging
    networks:
      - backend
      - frontend

  proxy:
    image: caddy:2-alpine
    container_name: wire-proxy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.25
    logging: *default-logging
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
