[project]
name = "agent-api"
version = "0.1.0"
description = "Viridian's FastAPI service foundation for agent execution."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162.2,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
agent-api = "agent.main:run"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
  "uv-build>=0.13.7,<0.14",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "agent"
module-root = "src"
